[package]
name = "better_sm64_collision"
version = "0.1.0"
edition = "2024"
build = "build.rs"
default-run = "better_sm64_collision"

[dependencies]
egui = "0.36.2"
egui-winit = "0.36.0"
eframe = "0.36.0"
rfd = "0.17.2"
winit = "0.30.0"
bytemuck = "1"

[[bin]]
name = "checksum"
path = "src/bin/checksum.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
